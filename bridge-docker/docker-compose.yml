  assethub-alice:
    image: parity/polkadot-parachain:1.3.0
    container_name: bridge-assethub-alice
    restart: always
    user: "root"
    ports:
      - "9655:9654"
    environment:
      - RUST_LOG=xcm=trace
    command: [
        "--pruning", "archive",
        "--enable-offchain-indexing", "true",
        "-d", "/data", 
        "--collator",
        "--alice", 
        "--force-authoring",
        "--chain", "/build-spec/assethub.json",
        "--port", "30533", 
        "--rpc-port", "9654",
        "--unsafe-rpc-external",
        "--rpc-cors", "all",
        "--execution", "wasm", 
        "--wasm-execution", "compiled",
        "--",
        "--execution", "wasm",
        "--wasm-execution", "compiled",
        "--chain", "/build-spec/rococo-raw.json",
        "--port", "30543",
        "--rpc-port", "10654",
