version: "2.4"

services:
  parachain-alice:
    image: sora2/substrate-local-parachain
    container_name: bridge-parachain-alice
    build:
      context: ..
      dockerfile: bridge-docker/Dockerfile.parachain
    restart: always
    user: "root"
    ports:
      - "9844:9844"
      - "9854:9854"
    environment:
      - RUST_LOG=parachain::candidate-backing=debug,parachain::collator-protocol=debug,beefy=debug,xcm=trace
    command: [
        "--pruning", "archive",
        "--enable-offchain-indexing", "true",
        "-d", "/data",
        "--collator",
        "--alice", 
        "--force-authoring",
        "--chain", "/build-spec/sora.json",
        "--port", "30333", 
        "--ws-port", "9844",
        "--rpc-port", "9854", 
        "--unsafe-ws-external",
        "--unsafe-rpc-external",
        "--rpc-cors", "all",
        "--execution", "wasm", 
        "--wasm-execution", "compiled",
        "--",
        "--execution", "wasm",
        "--wasm-execution", "compiled",
        "--chain", "/build-spec/rococo-raw.json",
        "--port", "30343",
        "--ws-port", "10844",
        "--rpc-port", "10854",
      ]
    # depends_on:
    #   build-spec-polkadot:
    #     condition: service_completed_successfully
    volumes:
      - ./build-spec-data:/build-spec
      - ./nodes-data/parachain-alice-data:/data
    networks:
      - bridgenet

  parachain-bob:
    image: sora2/substrate-local-parachain
    container_name: bridge-parachain-bob
    build:
      context: ..
      dockerfile: bridge-docker/Dockerfile.parachain
    restart: always
    user: "root"
    ports:
      - "9845:9844"
      - "9855:9854"
    environment:
      - RUST_LOG=xcm=trace
    command: [
        "--pruning", "archive",
        "--enable-offchain-indexing", "true",
        "-d", "/data",
        "--collator",
        "--bob",
        "--force-authoring",
        "--chain", "/build-spec/sora.json",
        "--port", "30333", 
        "--ws-port", "9844",
        "--rpc-port", "9854", 
        "--unsafe-ws-external",
        "--unsafe-rpc-external",
        "--rpc-cors", "all",
        "--execution", "wasm", 
        "--wasm-execution", "compiled",
        "--",
        "--execution", "wasm",
        "--wasm-execution", "compiled",
        "--chain", "/build-spec/rococo-raw.json",
        "--port", "30343",
        "--ws-port", "10844",
        "--rpc-port", "10854",
      ]
    # depends_on:
    #   build-spec-polkadot:
    #     condition: service_completed_successfully
    volumes:
      - ./build-spec-data:/build-spec
      - ./nodes-data/parachain-bob-data:/data
    networks:
      - bridgenet
    security_opt: 
      - apparmor=docker-default

  relaychain-alice:
    image: sora2/substrate-local-polkadot
    container_name: bridge-relaychain-alice
    build:
      context: .
      dockerfile: Dockerfile.polkadot
    restart: always
    user: "root"
    ports:
      - "9744:9744"
      - "9754:9754"
    environment:
      - RUST_LOG=xcm=trace
    command: [
        "--pruning", "archive",
        "--enable-offchain-indexing", "true",
        "-d", "/data", 
        "--alice", 
        "--chain", "/build-spec/rococo-raw.json",
        "--validator",
        "--port", "30433", 
        "--ws-port", "9744",
        "--rpc-port", "9754", 
        "--unsafe-ws-external",
        "--unsafe-rpc-external",
        "--rpc-cors", "all",
        "--execution", "wasm", 
        "--wasm-execution", "compiled"
      ]
    # depends_on:
    #   build-spec-polkadot:
    #     condition: service_completed_successfully
    volumes:
      - ./build-spec-data:/build-spec
      - ./nodes-data/relaychain-alice-data:/data
    networks:
      - bridgenet
    security_opt: 
      - apparmor=docker-default

  relaychain-bob:
